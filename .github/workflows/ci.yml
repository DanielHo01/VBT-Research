name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install core test deps
        # 单测只需 vbtcore 的核心数值库（含 onnxruntime 导入）；无需 ultralytics 等重型依赖
        run: |
          pip install --upgrade pip
          pip install opencv-python-headless numpy scipy onnxruntime

      - name: Run unit tests (26)
        run: python3 tests/run_all_tests.py

  # 引擎冒烟：只验证「模型在、能加载、能前向」这一层。
  # 开发集视频含可识别受试者，不随仓库发布（见 README「数据可得性」），
  # 因此原先跑 2 条真实视频的 smoke 换成合成帧。
  # 全量 34 视频基准（~5 分钟）保持本地运行，需先向作者取得视频。
  engine-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install core deps
        run: |
          pip install --upgrade pip
          pip install opencv-python-headless numpy scipy onnxruntime

      - name: Model loads and forwards (synthetic frame)
        run: |
          python3 - <<'PY'
          import numpy as np, onnxruntime as ort
          from vbtcore import analyze_video  # 公共 API 可导入

          sess = ort.InferenceSession("models/best.onnx", providers=["CPUExecutionProvider"])
          inp = sess.get_inputs()[0]
          x = np.zeros(inp.shape, dtype=np.float32)
          y = sess.run(None, {inp.name: x})[0]
          print("input", inp.shape, "-> output", y.shape)
          assert y.shape == (1, 5, 8400), f"unexpected output shape {y.shape}"
          PY

      - name: Benchmark脚本可解析（不执行）
        run: python3 -m py_compile scripts/run_benchmark_v0.py
